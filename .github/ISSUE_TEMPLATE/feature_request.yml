name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "I'm always frustrated when …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      multiple: true
      options:
        - Mac
        - iPhone / iPad
        - Widget / Live Activity
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've considered
