name: ChronologyMobile
options:
  bundleIdPrefix: com.codingpasanga
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Chronology:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team in Xcode (Signing & Capabilities) to run on a device
    DEVELOPMENT_TEAM: ""

targets:
  ChronologyMobile:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: Chronology
        product: ChronologyCore
      - target: ChronologyWidgets
    entitlements:
      path: App/Chronology.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.codingpasanga.chronology
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chronology
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codingpasanga.Chronology.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ChronologyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: Chronology
        product: ChronologyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/ChronologyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.codingpasanga.chronology
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Chronology
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codingpasanga.Chronology.mobile.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  ChronologyMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ChronologyMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codingpasanga.Chronology.mobile.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChronologyMobile

schemes:
  ChronologyMobile:
    build:
      targets:
        ChronologyMobile: all
        ChronologyWidgets: all
    test:
      targets:
        - ChronologyMobileUITests
