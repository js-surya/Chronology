name: ChronologyMobile
options:
  bundleIdPrefix: com.codingpasanga
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Chronology:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Your team (same as ByteCache); needed for the App Group and iCloud on devices
    DEVELOPMENT_TEAM: 3K4RU72283

targets:
  ChronologyMobile:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # Icon Composer icon shared with the Mac app (Liquid Glass layers)
      - path: ../Design/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Chronology
        product: ChronologyCore
      - target: ChronologyWidgets
    entitlements:
      path: App/Chronology.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.codingpasanga.chronology
        # Same identifier in the Mac app, so both read one key-value store
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.codingpasanga.chronology
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chronology
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codingpasanga.Chronology.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ChronologyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: Chronology
        product: ChronologyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/ChronologyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.codingpasanga.chronology
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Chronology
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codingpasanga.Chronology.mobile.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  ChronologyMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ChronologyMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codingpasanga.Chronology.mobile.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChronologyMobile

  # Team-signed Mac app (iCloud sync needs a provisioned signature; package_app.sh is ad-hoc)
  ChronologyMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ../Sources/Chronology
      - path: ../Design/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Chronology
        product: ChronologyCore
    entitlements:
      path: Mac/ChronologyMac.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.codingpasanga.chronology
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Chronology
        CFBundleName: Chronology
        CFBundleShortVersionString: "4.0.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        LSUIElement: false
        NSUserNotificationsUsageDescription: Chronology needs permission to send you reminders before your classes start.
    settings:
      base:
        PRODUCT_NAME: Chronology
        PRODUCT_BUNDLE_IDENTIFIER: com.codingpasanga.Chronology
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  ChronologyMobile:
    build:
      targets:
        ChronologyMobile: all
        ChronologyWidgets: all
    test:
      targets:
        - ChronologyMobileUITests
  ChronologyMac:
    build:
      targets:
        ChronologyMac: all
